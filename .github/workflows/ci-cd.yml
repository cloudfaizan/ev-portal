name: EV Portal CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Build and push Docker image
        env:
          IMAGE: dockerfaizan007/ev-charging-portal
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          export TOKEN_JSON

          python3 - <<'PY'
          import os
          import json
          import base64

          token = json.loads(os.environ["TOKEN_JSON"])["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref"
          ):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig --name ev-portal-eks --region us-east-1
          kubectl auth can-i patch deployments -n default

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f deployment.yaml -f service.yaml

      - name: Deploy new image
        env:
          IMAGE: dockerfaizan007/ev-charging-portal
          TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/ev-portal ev-portal="$IMAGE:$TAG" -n default
          kubectl rollout status deployment/ev-portal -n default --timeout=180s
