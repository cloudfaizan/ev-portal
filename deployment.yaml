apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-portal
  labels: {app: ev-portal}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ev-portal}
  template:
    metadata:
      labels: {app: ev-portal}
    spec:
      containers:
        - name: ev-portal
          image: dockerfaizan007/ev-charging-portal:v3
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ev-portal-db, key: database-url}}
            - name: FLASK_SECRET_KEY
              valueFrom: {secretKeyRef: {name: ev-portal-app, key: flask-secret-key}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
